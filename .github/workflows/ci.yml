name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Run by hand from the Actions tab, and reused by the release workflow.
  workflow_dispatch:
  workflow_call:

# The token can only read the repository.
permissions:
  contents: read

# A newer push to the same pull request cancels the older run. Runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build and zip (Chrome + Firefox)
        run: pnpm zip && pnpm zip:firefox
      - name: Lint Firefox build
        run: pnpm lint:firefox
      - uses: actions/upload-artifact@v4
        with:
          name: extension-zips
          path: .output/*.zip

  e2e:
    # Real browsers: Chrome smoke test, feature checks, accessibility audit (axe) and real Firefox.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Pinned so a new browser release can't break CI without a code change. Update on purpose.
      # Chrome for Testing (branded Chrome ignores --load-extension) and Firefox.
      BROWSERS_CLI: '@puppeteer/browsers@3.2.6'
      CHROME_VERSION: '143.0.7499.169'
      FIREFOX_VERSION: 'stable_159.0'
      NO_SANDBOX: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Cache browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/browsers
          key: browsers-${{ runner.os }}-chrome-${{ env.CHROME_VERSION }}-firefox-${{ env.FIREFOX_VERSION }}
      - name: Install browsers
        run: |
          set -euo pipefail
          dir="$HOME/.cache/browsers"
          install() { pnpm dlx "$BROWSERS_CLI" install "$1" --path "$dir" | tail -1 | cut -d' ' -f2-; }
          chrome=$(install "chrome@$CHROME_VERSION")
          firefox=$(install "firefox@$FIREFOX_VERSION")
          # Fail here, with a clear message, rather than in the first test.
          for bin in "$chrome" "$firefox"; do
            [ -x "$bin" ] || { echo "::error::Browser not installed: '$bin'"; exit 1; }
          done
          echo "CHROME=$chrome" >> "$GITHUB_ENV"
          echo "FIREFOX=$firefox" >> "$GITHUB_ENV"
      - name: Install browser system libraries
        # GitHub's image already has most of these; other images (e.g. act's) don't.
        # Chrome lists its packages in deb.deps; Firefox's are listed here (Ubuntu 22.04 and 24.04 names).
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo=sudo; [ "$(id -u)" = 0 ] && sudo=
          chrome_deps=$(paste -sd, "$(dirname "$CHROME")/deb.deps")
          firefox_deps='libgtk-3-0t64 | libgtk-3-0, libdbus-glib-1-2, libx11-xcb1, libxtst6, libasound2t64 | libasound2'
          $sudo apt-get update -qq
          $sudo apt-get satisfy -y -qq --no-install-recommends "$chrome_deps, $firefox_deps"

      # Build once; the test scripts below load these builds.
      - name: Build (Chrome + Firefox)
        run: pnpm build && pnpm build:firefox

      - name: Chrome smoke test
        run: node tests/e2e/smoke.mjs
      - name: Feature checks (quick save, encrypted export, current-window restore, backup files, layout)
        run: mkdir -p "$SHOT_DIR" && node tests/e2e/features.mjs
        env:
          SHOT_DIR: ${{ runner.temp }}/screenshots
      - name: Accessibility audit
        run: node tests/e2e/a11y.mjs
      - name: Firefox end-to-end
        run: node tests/e2e/firefox.mjs

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore
