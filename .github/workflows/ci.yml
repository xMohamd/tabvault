name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build and zip (Chrome + Firefox)
        run: pnpm zip && pnpm zip:firefox
      - name: Lint Firefox build
        run: pnpm lint:firefox
      - uses: actions/upload-artifact@v4
        with:
          name: extension-zips
          path: .output/*.zip
